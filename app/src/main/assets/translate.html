<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B1929;--surface:#0F2233;--primary:#4FC3F7;--text:#E8EEF4;--text-sec:rgba(232,238,244,0.55);--border:rgba(79,195,247,0.15);--on-primary:#00222E}
body.light{--bg:#F0F4F8;--surface:#FFFFFF;--primary:#0288D1;--text:#0B1929;--text-sec:rgba(11,25,41,0.6);--border:rgba(2,136,209,0.2);--on-primary:#FFFFFF}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px}
.back{display:inline-flex;color:var(--primary);text-decoration:none;font-size:15px;padding:10px 0;margin-bottom:10px}
h1{font-size:22px;font-weight:800;margin-bottom:20px}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:15px;font-family:inherit;min-height:130px;resize:none;outline:none}
textarea:focus{border-color:var(--primary)}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:15px;border:none;margin-top:12px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>
<a class="back" href="resource://android/assets/home.html">→ الرئيسية</a>
<h1>🌐 الترجمة</h1>
<textarea id="txt" placeholder="الصق أو اكتب النص هنا..."></textarea>
<button class="btn" onclick="doTranslate()">ترجم عبر Google</button>
<button class="btn ghost" onclick="location.href='https://translate.google.com'">فتح مترجم Google</button>
<script>
function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
if((ls('theme') || 'dark') === 'light') document.body.classList.add('light');
function doTranslate(){
  var t = document.getElementById('txt').value.trim();
  if(!t){ alert('أدخل نصاً'); return; }
  location.href = 'https://translate.google.com/?sl=auto&tl=ar&text=' + encodeURIComponent(t) + '&op=translate';
}
</script>
</body>
</html>
