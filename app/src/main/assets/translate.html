<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B1929;--surface:#0F2233;--primary:#4FC3F7;--text:#E8EEF4;--border:rgba(79,195,247,.15);--on-primary:#00222E}
body.light{--bg:#F0F4F8;--surface:#FFF;--primary:#0288D1;--text:#0B1929;--border:rgba(2,136,209,.2);--on-primary:#FFF}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px}
.back{color:var(--primary);text-decoration:none;font-size:15px;display:inline-block;padding:10px 0;margin-bottom:10px}
h1{font-size:20px;font-weight:800;margin-bottom:16px}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:15px;font-family:inherit;min-height:130px;resize:none;outline:none}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;border:none;margin-top:12px;cursor:pointer;font-size:14px}
.btn.g{background:var(--surface);color:var(--text);border:1px solid var(--border)}
</style></head><body>
<a class="back" href="resource://android/assets/home.html">→ الرئيسية</a><h1>🌐 الترجمة</h1>
<textarea id="t" placeholder="اكتب أو الصق النص..."></textarea>
<button class="btn" onclick="tr()">ترجم عبر Google</button>
<button class="btn g" onclick="location.href='https://translate.google.com'">فتح مترجم Google</button>
<script>
try{if((localStorage.getItem('theme')||'dark')==='light')document.body.classList.add('light')}catch(e){}
function tr(){var x=document.getElementById('t').value.trim();if(!x){alert('أدخل نصاً');return}location.href='https://translate.google.com/?sl=auto&tl=ar&text='+encodeURIComponent(x)+'&op=translate'}
</script></body></html>
