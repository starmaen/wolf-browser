<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B1929;--surface:#0F2233;--card2:#183348;--primary:#4FC3F7;--text:#E8EEF4;--text-sec:rgba(232,238,244,.55);--border:rgba(79,195,247,.15)}
body.light{--bg:#F0F4F8;--surface:#FFF;--card2:#D0DAE5;--primary:#0288D1;--text:#0B1929;--text-sec:rgba(11,25,41,.6);--border:rgba(2,136,209,.2)}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px}
.back{color:var(--primary);text-decoration:none;font-size:15px;display:inline-block;padding:10px 0;margin-bottom:10px}
h1{font-size:20px;font-weight:800;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.ic{width:38px;height:38px;border-radius:10px;background:var(--card2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.body{flex:1;min-width:0}.title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--text-sec);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:60px 20px;color:var(--text-sec)}
.empty .i{font-size:52px;opacity:.5;margin-bottom:12px}
</style></head><body>
<a class="back" href="resource://android/assets/home.html">→ الرئيسية</a><h1>⬇ التنزيلات</h1>
<div id="list"></div>
<script>
try{if((localStorage.getItem('theme')||'dark')==='light')document.body.classList.add('light')}catch(e){}
function gd(){try{var p=new URLSearchParams(location.search);var d=p.get('d');return d?JSON.parse(atob(d.replace(/-/g,'+').replace(/_/g,'/'))):[]}catch(e){return[]}}
function esc(s){return String(s||'').replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
var d=gd();
if(!d.length){document.getElementById('list').innerHTML='<div class="empty"><div class="i">⬇</div><p>لا توجد تنزيلات</p></div>'}
else{document.getElementById('list').innerHTML=d.map(function(x){return '<div class="row"><div class="ic">📦</div><div class="body"><div class="title">'+esc(x.filename||'ملف')+'</div><div class="sub">'+esc(x.url||'')+'</div></div></div>'}).join('')}
</script></body></html>
