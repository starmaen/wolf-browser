<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B1929;--surface:#0F2233;--card2:#183348;--primary:#4FC3F7;--text:#E8EEF4;--text-sec:rgba(232,238,244,.55);--border:rgba(79,195,247,.15);--danger:#FF6B6B;--success:#69F0AE}
body.light{--bg:#F0F4F8;--surface:#FFF;--card2:#D0DAE5;--primary:#0288D1;--text:#0B1929;--text-sec:rgba(11,25,41,.6);--border:rgba(2,136,209,.2)}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px}
.back{color:var(--primary);text-decoration:none;font-size:15px;display:inline-block;padding:10px 0;margin-bottom:10px}
h1{font-size:20px;font-weight:800;margin-bottom:16px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ic{width:38px;height:38px;border-radius:10px;background:var(--card2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.body{flex:1;min-width:0}
.title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--text-sec);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-sec);margin-top:5px}
.badge{padding:2px 8px;border-radius:50px;font-size:10px;font-weight:700}
.badge.complete{background:rgba(105,240,174,.2);color:var(--success)}
.badge.running{background:rgba(79,195,247,.2);color:var(--primary)}
.badge.failed{background:rgba(255,107,107,.2);color:var(--danger)}
.empty{text-align:center;padding:60px 20px;color:var(--text-sec)}
.empty .i{font-size:52px;opacity:.5;margin-bottom:12px}
.bc{width:100%;padding:12px;border-radius:12px;background:var(--surface);color:var(--danger);border:1px solid var(--border);font-weight:600;font-size:13px;margin-top:16px;cursor:pointer}
</style></head><body>
<a class="back" href="resource://android/assets/home.html">→ الرئيسية</a><h1>⬇ التنزيلات</h1>
<div id="list"></div><button class="bc" id="clr" style="display:none">🗑 مسح القائمة</button>
<script>
try{if((localStorage.getItem('theme')||'dark')==='light')document.body.classList.add('light')}catch(e){}
function gd(){try{var p=new URLSearchParams(location.search);var d=p.get('d');return d?JSON.parse(atob(d.replace(/-/g,'+').replace(/_/g,'/'))):[]}catch(e){return[]}}
function esc(s){return String(s||'').replace(/[<>&"']/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(b){if(!b||b<0)return '?';var k=1024,u=['B','KB','MB','GB'];var i=0;while(b>=k&&i<u.length-1){b/=k;i++}return b.toFixed(1)+' '+u[i]}
function render(){
  var d=gd();
  if(!d.length){document.getElementById('list').innerHTML='<div class="empty"><div class="i">⬇</div><p>لا توجد تنزيلات</p><p style="font-size:12px;margin-top:8px">حمّل ملفاً من أي موقع وسيظهر هنا</p></div>';document.getElementById('clr').style.display='none';return}
  document.getElementById('list').innerHTML=d.map(function(x){
    var st = x.status||'unknown';
    var bd = st==='complete'?'complete':(st==='running'||st==='pending'||st==='paused')?'running':(st==='failed'?'failed':'');
    var lbl = st==='complete'?'اكتمل':st==='running'?'جارٍ':st==='failed'?'فشل':st==='pending'?'في الانتظار':'جاري';
    var pr = x.progress||0;
    return '<div class="row">'+
      '<div class="rhead">'+
        '<div class="ic">📦</div>'+
        '<div class="body">'+
          '<div class="title">'+esc(x.filename||'ملف')+'</div>'+
          '<div class="sub">'+esc(x.url||'')+'</div>'+
        '</div>'+
        '<span class="badge '+bd+'">'+lbl+'</span>'+
      '</div>'+
      '<div class="bar"><i style="width:'+pr+'%"></i></div>'+
      '<div class="meta"><span>'+(x.downloaded?fmt(x.downloaded):'0')+' / '+(x.total?fmt(x.total):'?')+'</span><span>'+pr+'%</span></div>'+
    '</div>';
  }).join('');
  document.getElementById('clr').style.display='block';
}
document.getElementById('clr').onclick=function(){ if(confirm('مسح قائمة التنزيلات؟')) location.href='wolf://clear-downloads'; };
render();
</script></body></html>
