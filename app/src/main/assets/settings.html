<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B1929;--surface:#0F2233;--card2:#183348;--primary:#4FC3F7;--text:#E8EEF4;--text-sec:rgba(232,238,244,.55);--border:rgba(79,195,247,.15);--danger:#FF6B6B}
body.light{--bg:#F0F4F8;--surface:#FFF;--card2:#D0DAE5;--primary:#0288D1;--text:#0B1929;--text-sec:rgba(11,25,41,.6);--border:rgba(2,136,209,.2)}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px 40px}
.back{display:inline-flex;color:var(--primary);text-decoration:none;font-size:15px;padding:10px 0;margin-bottom:10px}
h1{font-size:20px;font-weight:800;margin-bottom:16px}
.sec{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-sec);margin:20px 4px 10px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
.ic{width:40px;height:40px;border-radius:11px;background:var(--card2);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.body{flex:1}.title{font-size:14px;font-weight:600}.sub{font-size:11px;color:var(--text-sec);margin-top:2px}
.sw{width:44px;height:26px;border-radius:50px;background:var(--card2);position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#69F0AE}.sw.on::after{transform:translateX(-18px)}
html[dir=ltr] .sw.on::after{transform:translateX(18px)}
.row.danger .ic,.row.danger .title{color:var(--danger)}
</style></head><body>
<a class="back" href="resource://android/assets/home.html">→ الرئيسية</a>
<h1>⚙ الإعدادات</h1>
<div class="sec">المظهر</div>
<div class="row" onclick="toggleTheme()"><div class="ic">🌙</div><div class="body"><div class="title">الوضع الليلي</div><div class="sub" id="tSub">مفعّل</div></div><div class="sw" id="tSw"></div></div>
<div class="sec">الخصوصية</div>
<div class="row" onclick="toggleAd()"><div class="ic">🛡</div><div class="body"><div class="title">مانع الإعلانات</div><div class="sub" id="aSub">مفعّل</div></div><div class="sw" id="aSw"></div></div>
<div class="sec">البيانات</div>
<div class="row danger" onclick="if(confirm('مسح السجل؟'))location.href='wolf://clear-history'"><div class="ic">🕘</div><div class="body"><div class="title">مسح السجل</div><div class="sub">حذف سجل التصفح</div></div></div>
<div class="row danger" onclick="if(confirm('مسح المفضلة؟'))location.href='wolf://clear-bookmarks'"><div class="ic">⭐</div><div class="body"><div class="title">مسح المفضلة</div><div class="sub">حذف كل المواقع المحفوظة</div></div></div>
<div class="row danger" onclick="if(confirm('مسح كل شيء؟')){try{localStorage.clear()}catch(e){};location.href='wolf://clear-all'}"><div class="ic">🔥</div><div class="body"><div class="title">مسح كل شيء</div><div class="sub">السجل + المفضلة + الإعدادات</div></div></div>
<div class="sec">حول</div>
<div class="row" onclick="location.href='resource://android/assets/about.html'"><div class="ic">ℹ</div><div class="body"><div class="title">حول التطبيق</div><div class="sub">Wolf Browser 1.0.0</div></div></div>
<script>
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function apply(){var t=ls('theme')||'dark';document.body.classList.toggle('light',t==='light');document.getElementById('tSw').classList.toggle('on',t==='dark');document.getElementById('tSub').textContent=t==='dark'?'مفعّل':'موقوف';var a=ls('adblock')!=='off';document.getElementById('aSw').classList.toggle('on',a);document.getElementById('aSub').textContent=a?'مفعّل':'موقوف'}
function toggleTheme(){ls('theme',(ls('theme')||'dark')==='light'?'dark':'light');apply()}
function toggleAd(){ls('adblock',ls('adblock')!=='off'?'off':'on');apply()}
apply();
</script></body></html>
